name: Build Metalstats

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install nuitka customtkinter openpyxl pandas requests

      - name: Build with Nuitka (Best for AV)
        shell: pwsh
        run: |
          $NuitkaArgs = @(
            '--mode=standalone'
            '--assume-yes-for-downloads'
            '--lto=no'
            '--windows-console-mode=disable'
            '--windows-company-name=JKaL Studio'
            '--windows-product-name=Metalstats'
            '--windows-file-version=1.0.0.0'
            '--windows-product-version=1.0.0.0'
            '--windows-file-description=Metalstats built with Nuitka'
            'Metalstorm_Stats.pyw'
          )
          Write-Host "Building with: $NuitkaArgs"
          python -m nuitka @NuitkaArgs
          if ($LASTEXITCODE -ne 0) { throw 'Nuitka build failed' }

      - name: Prepare distribution
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $d = Get-ChildItem . -Directory -Filter *.dist | Select-Object -First 1
          if (-not $d) { throw 'dist folder not found' }
          Copy-Item $d.FullName .\dist\Application -Recurse -Force

      - name: SHA256
        shell: pwsh
        run: |
          Get-ChildItem .\dist -File -Recurse | ForEach-Object { $h=Get-FileHash $_.FullName -Algorithm SHA256; "$($h.Hash.ToLower())  $($_.Name)" | Out-File .\SHA256SUMS.txt -Append -Encoding utf8 }
          Copy-Item .\SHA256SUMS.txt .\dist\

      - name: Create ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path .\dist\* -DestinationPath .\Metalstats-Windows-x64.zip -Force
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Metalstats-Windows-x64
          path: Metalstats-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14
